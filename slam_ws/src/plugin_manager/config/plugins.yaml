# Registry of SLAM plugins that plugin_manager can discover and load.
#
# Each entry declares where a plugin's concrete implementation is expected to
# live: `package` is the plugin_ws ROS package, `module` is the submodule
# inside it (leave empty to import the package's __init__ directly), and
# `class` is the SlamPlugin subclass plugin_manager will instantiate.
# `config` (optional) is a path to the plugin's default config, resolved
# relative to that plugin's own installed share directory; when present,
# plugin_manager calls instance.initialize(node, config_path) after
# instantiating it.
#
# orb_slam3, cnn_slam, and rl_slam are not implemented yet (plugin_ws
# packages are stubs), so plugin_manager will report them as
# `not_implemented` until a real SlamPlugin subclass matching the declared
# module/class exists. slam_toolbox is implemented.
plugins:
  - id: orb_slam3
    package: orb_slam_plugin
    module: orb_slam3_plugin
    class: ORBSlam3Plugin
    description: ORB-SLAM3 feature-based visual SLAM plugin.

  - id: cnn_slam
    package: cnn_slam_plugin
    module: ""
    class: CNNSlamPlugin
    description: CNN-based learned SLAM plugin.

  - id: rl_slam
    package: rl_slam_plugin
    module: ""
    class: RLSlamPlugin
    description: Reinforcement-learning-based SLAM plugin.

  - id: slam_toolbox
    package: slam_toolbox_plugin
    module: slam_toolbox_plugin
    class: SlamToolboxPlugin
    description: Wrapper around the ROS slam_toolbox package.
    config: config/slam_toolbox_params.yaml
